title: Sunil Arora
description: Software Engineer at Google | Kubernetes, GKE, AI
theme: minima
show_downloads: false

header_pages:
  - about.md

# Older posts (2009-2014). Kept in the repo but not published: `output: false`
# stops the individual pages being generated, and archive.html is marked
# `published: false`. Flip both to bring the archive back at /archive/.
collections:
  archive:
    output: false
    permalink: /archive/:name/

defaults:
  - scope:
      path: ""
      type: archive
    values:
      layout: archived

# Setting `exclude` replaces Jekyll's defaults, so the usual entries are
# repeated here alongside the local tooling files.
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - AGENTS.md
  - CLAUDE.md
  - vendor
  - .bundle
  - node_modules
