title: Sunil Arora
description: Software Engineer at Google | Kubernetes, GKE, AI
theme: minima
show_downloads: false

# Header navigation. Defined here rather than derived from page titles, so the
# nav label is independent of a page's `title` (which drives the <title> tag).
# The entry matching the current page renders as plain text, not a link.
nav:
  - title: Posts
    url: /
  - title: About
    url: /about/

# Older posts (2009-2014). Kept in the repo but not published: `output: false`
# stops the individual pages being generated, and archive.html is marked
# `published: false`. Flip both to bring the archive back at /archive/.
collections:
  archive:
    output: false
    permalink: /archive/:name/

defaults:
  - scope:
      path: ""
      type: archive
    values:
      layout: archived

# Setting `exclude` replaces Jekyll's defaults, so the usual entries are
# repeated here alongside the local tooling files.
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - AGENTS.md
  - CLAUDE.md
  - vendor
  - .bundle
  - node_modules
